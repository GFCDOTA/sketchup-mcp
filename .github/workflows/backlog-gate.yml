name: backlog-gate

# O quadro nao pode mentir: Done so com Issue fechada, prova e comentario de evidencia.
# Com o secret BACKLOG_PROJECT_TOKEN (PAT com read:project) confere tambem o Project;
# sem ele, so as regras que dependem de Issues e labels (--no-project).

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  issues: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: backlog gate
        env:
          PROJECT_TOKEN: ${{ secrets.BACKLOG_PROJECT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            GH_TOKEN="$PROJECT_TOKEN" python -m tools.validation.backlog_gate
          else
            echo "::notice::BACKLOG_PROJECT_TOKEN ausente: gate sem Project"
            python -m tools.validation.backlog_gate --no-project
          fi
