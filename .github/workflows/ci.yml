name: ci

# A esteira que se valida sozinha: todo PR/push pra develop|main roda os testes
# de contrato, os gates de fidelidade determinísticos e o smoke do servidor MCP.
# Tudo SEM SketchUp (os passos que exigem SU degradam via skipif / só rodam local).
# O uv.lock e' a fonte reproduzivel das dependencias: pyproject declara faixas,
# uv.lock fixa a resolucao e o CI nunca instala "latest dentro da faixa" por acaso.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancela runs superados no mesmo ref (não enfileira commits velhos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runner é headless (sem DISPLAY) — força o backend não-interativo do matplotlib.
  MPLBACKEND: Agg

jobs:
  dependency-lock:
    name: uv lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: pyproject.toml and uv.lock agree
        run: uv lock --check

  tests:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment (core + dev)
        run: uv sync --locked --extra dev
      # PT_TO_M (core/scale.py) e' lido UMA vez por processo — nao da pra
      # misturar fixtures sinteticas (default ~0.0352) com a escala real de
      # planta_74 (0.0259, cota-anchored) no MESMO `pytest tests/`. Duas
      # invocacoes, cada uma com o env certo (ver tests/conftest.py).
      - name: Contract + gate test suite (default scale — fixtures sintéticas)
        run: uv run --no-sync python -m pytest tests/ -q -m "not planta74_scale"
      - name: Contract + gate test suite (planta_74 real — escala 0.0259)
        if: always()
        env:
          PT_TO_M: "0.0259"
        run: uv run --no-sync python -m pytest tests/ -q -m planta74_scale

  fidelity-gates:
    name: deterministic fidelity gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment (core)
        run: uv sync --locked
      # Consensus-only detectors (opening<->host, wall overlap). Puros, sem SU/rede.
      # exit 0=PASS, 1=FAIL, 3=INCOMPLETE — o exit code É o gate.
      - name: FP-042 P6 — binary asset provenance
        run: uv run --no-sync python -m tools.rooms.asset_provenance
      - name: FP-042 P6 — all canonical reference provenance
        run: uv run --no-sync python -m tools.rooms.reference_provenance
      - name: FP-042 — strict zero-pending inventory
        run: uv run --no-sync python -m tools.rooms.inventory_gate --strict
      - name: FP-042 — room boundaries including legacy facades
        run: uv run --no-sync python -m tools.rooms.ownership_audit
      - name: FP-042 P3 — exact owner coverage
        run: uv run --no-sync python -m tools.rooms.p3_ownership
      - name: Gate — planta_74
        run: uv run --no-sync python -m tools.validation.run_deterministic_gates --fixture planta_74
      - name: Gate — quadrado (micro-fixture canônico)
        run: uv run --no-sync python -m tools.validation.run_deterministic_gates --fixture quadrado
      # Scale is checked against an independent source (PDF cota / fixture),
      # NEVER report metadata or environment PT_TO_M. Fails on 0.74x shells.
      - name: FP-043 P3 — absolute scale (planta_74)
        run: uv run --no-sync python -m tools.validation.scale_anchor_gate --consensus fixtures/planta_74/consensus_with_human_walls_and_soft_barriers.json --report artifacts/planta_74/geometry_report.json
      - name: FP-043 P3 — absolute scale (quadrado)
        run: uv run --no-sync python -m tools.validation.scale_anchor_gate --consensus fixtures/quadrado/consensus_with_window.json --report docs/specs/_assets/quadrado_canonical_geometry_report.json

  mcp-server:
    name: mcp server (smoke + stdio handshake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment (core + dev + mcp)
        run: uv sync --locked --extra dev --extra mcp
      # Exercita as tools in-process (as su_* respondem UNAVAILABLE sem SketchUp).
      - name: In-process smoke (18 tools)
        run: uv run --no-sync python -m tools.mcp_server.smoke
      # Sobe o server por stdio (como o Claude Code faz) e fala MCP de verdade.
      - name: Real stdio handshake (initialize / tools-list / call_tool)
        run: uv run --no-sync python -m tools.mcp_server.stdio_check
      # Testes que EXIGEM o extra mcp: aqui ele está instalado, então skip = falha (REQUIRE_EXTRAS).
      - name: MCP-dependent tests (strict stdout client, preload) — no silent skip
        env:
          REQUIRE_EXTRAS: "1"
        run: uv run --no-sync python -m pytest tests/test_mcp_stdout_isolation.py tests/test_su_spawn_detached.py -q -rs
