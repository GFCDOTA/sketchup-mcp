<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio — ao vivo</title>
<style>
  :root{
    --bg:#EDE9E1; --panel:#F7F4ED; --ink:#28221A; --muted:#7C7364;
    --line:#D9D2C3; --accent:#A97B2F; --accent-soft:#EADFC8;
    --ok:#5E8A67; --shadow:0 1px 3px rgba(40,34,26,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16130E; --panel:#1F1A13; --ink:#EAE3D4; --muted:#9C9280;
      --line:#332C20; --accent:#D2A759; --accent-soft:#3A2F1B;
      --ok:#7FA987; --shadow:none;
    }
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;
    margin:0; padding:28px 16px 64px;}
  main{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:22px;}
  h1{font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:1.7rem;
     margin:0; letter-spacing:-.01em;}
  .sub{color:var(--muted); margin:2px 0 0; font-size:.92rem;}
  .live{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ok);
        font-weight:600;}
  .live i{width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block;}
  @media (prefers-reduced-motion: no-preference){
    .live i{animation:blink 1.4s ease-in-out infinite;}
    @keyframes blink{50%{opacity:.25}}
  }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:18px 20px; box-shadow:var(--shadow);}
  .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em;
         color:var(--muted); margin:0 0 10px; font-weight:600;}
  .now{border-left:4px solid var(--accent);}
  .now .big{font-size:1.15rem; font-weight:600; margin:0;}
  .now .hint{color:var(--muted); margin:6px 0 0; font-size:.92rem;}
  ol.steps{list-style:none; margin:0; padding:0;}
  ol.steps li{display:flex; gap:12px; padding:7px 0; align-items:baseline;}
  .dot{flex:none; width:12px; height:12px; border-radius:50%; position:relative; top:1px;
       border:2px solid var(--line);}
  li.done .dot{background:var(--ok); border-color:var(--ok);}
  li.current .dot{background:var(--accent); border-color:var(--accent);}
  @media (prefers-reduced-motion: no-preference){
    li.current .dot{animation:pulse 1.6s ease-in-out infinite;}
    @keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent);}}
  }
  li.done, li.pending{color:var(--muted);}
  li.current{font-weight:600;}
  .t{margin-left:auto; font:.78rem ui-monospace,Consolas,monospace; color:var(--muted);}
  .kit-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .kcard{border:1px solid var(--line); border-radius:8px; padding:10px; background:var(--bg);}
  .kcard .ph{background:#fff; border-radius:6px; height:118px; display:flex;
             align-items:center; justify-content:center; margin-bottom:8px; overflow:hidden;}
  .kcard .ph.tall{height:210px; background:transparent;}
  .kcard img{max-height:108px; max-width:100%;}
  .kcard .ph.tall img{max-height:200px;}
  .kcard .nm{font-size:.85rem; font-weight:600; margin:0;}
  .kcard .ds{font-size:.74rem; color:var(--muted); margin:0 0 8px;}
  .opts{display:flex; gap:6px;}
  .opt{flex:1; font:600 .78rem inherit; font-family:inherit; padding:6px 0; cursor:pointer;
       border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--muted);}
  .opt.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  textarea{width:100%; min-height:74px; margin-top:14px; padding:10px 12px;
           border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);
           font:inherit; font-size:.92rem; resize:vertical;}
  .sendrow{display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap;}
  #send{font:600 .95rem inherit; font-family:inherit; padding:11px 26px; cursor:pointer;
        border:none; border-radius:8px; background:var(--accent); color:var(--bg);}
  #send:disabled{opacity:.5; cursor:default;}
  #send:active{transform:scale(.98);}
  .msg{font-size:.85rem; color:var(--muted);}
  .score-row{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:6px;}
  .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%;}
  .bar i{display:block; width:100%; border-radius:3px 3px 0 0; background:var(--line); font-style:normal;}
  .bar.last i{background:var(--accent);}
  .bar b{font:.8rem ui-monospace,Consolas,monospace; font-weight:400; font-variant-numeric:tabular-nums;}
  .bar.last b{font-weight:700;}
  .bar span{font-size:.68rem; color:var(--muted);}
  .badge{display:inline-block; background:var(--accent-soft); color:var(--accent);
         border-radius:999px; padding:3px 11px; font-size:.78rem; font-weight:700;}
  img.render{width:100%; border-radius:8px; display:block;}
  .top3{margin:0; padding-left:20px;}
  .top3 li{margin:6px 0;}
  footer{color:var(--muted); font-size:.8rem; text-align:center;}

  /* ---- widget: monitor de atividade ao vivo, canto flutuante ---- */
  #designer-widget{position:fixed; right:18px; bottom:18px; z-index:50;
    font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;}
  .dw-app{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); box-shadow:0 6px 22px rgba(40,34,26,.20);
    border-radius:16px; padding:10px 18px 10px 10px; cursor:pointer; user-select:none;
    max-width:300px;}
  .dw-app:hover{border-color:var(--accent);}
  .dw-gear{flex:none; width:46px; height:46px; color:var(--accent);}
  .dw-gear svg{width:100%; height:100%; display:block;}
  .dw-gear.spinning svg{animation:dwspin 3.2s linear infinite;}
  .dw-gear.idle svg{color:var(--ok);}
  @media (prefers-reduced-motion: no-preference){
    @keyframes dwspin{to{transform:rotate(360deg);}}
  }
  .dw-now{min-width:0;}
  .dw-now .dw-tag{font-size:.66rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:700; margin:0 0 2px;}
  .dw-now .dw-current{font-size:.86rem; font-weight:700; margin:0; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical;}
  .dw-panel{position:absolute; right:0; bottom:calc(100% + 10px); width:320px; max-height:60vh;
    overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 28px rgba(40,34,26,.22); padding:14px 16px;}
  .dw-panel h4{margin:0 0 10px; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:700;}
  .dw-row{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
  .dw-row:first-of-type{border-top:none;}
  .dw-dot{width:9px; height:9px; border-radius:50%; flex:none; margin-top:5px; background:var(--accent);}
  @media (prefers-reduced-motion: no-preference){
    .dw-dot.pulsing{animation:dwpulse 1.3s ease-in-out infinite;}
    @keyframes dwpulse{50%{opacity:.35}}
  }
  .dw-dot.idle{background:var(--ok);}
  .dw-row .dw-body{min-width:0;}
  .dw-room{font-size:.82rem; font-weight:700; margin:0;}
  .dw-resumo{font-size:.76rem; color:var(--muted); margin:2px 0 0; line-height:1.35;}
  .dw-mood{display:inline-block; margin-top:4px; font-size:.68rem; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:1px 8px;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

// app inteiro em React (sem build — Babel standalone transpila JSX no browser;
// server.py continua stdlib puro, só serve este HTML). Poll de /api/status a
// cada 5s é a única fonte de verdade — nada de estado local pra dados do Claude.

const PECAS = [
  {id:'vaso',     nm:'Vaso',             ds:'Roca The Gap, caixa acoplada',            img:'/assets/vaso_roca_gap.jpg'},
  {id:'cuba',     nm:'Cuba under-mount', ds:'Deca Slim 50cm (kit em ébano fosco)',     img:'/assets/cuba_deca_slim_L33050.jpg'},
  {id:'torneira', nm:'Torneira',         ds:'Deca Level black matte, bica média',      img:'/assets/torneira_deca_level_2880BL.jpg'},
  {id:'box',      nm:'Box de correr',    ds:'Ideia Glass Nobre, perfil preto',         img:'/assets/box_ideiaglass_nobre.jpg'},
  {id:'gabinete', nm:'Gabinete suspenso',ds:'Roca Tura, 2 gavetas (nosso vira greige)',img:'/assets/gabinete_roca_tura.jpg'},
  {id:'chuveiro', nm:'Chuveiro de teto', ds:'Deca Flex Max 22cm + comando You',        img:'/assets/chuveiro_deca_flexmax_22.jpg'}
];

function useStatus(intervalMs){
  const [st, setSt] = useState(null);
  useEffect(() => {
    let alive = true;
    function load(){
      fetch('/api/status').then(r => r.json())
        .then(d => { if (alive) setSt(d); })
        .catch(() => {});
    }
    load();
    const t = setInterval(load, intervalMs);
    return () => { alive = false; clearInterval(t); };
  }, [intervalMs]);
  return st;
}

function Header(){
  return (
    <header>
      <h1>Estúdio Banheiro — acompanhamento ao vivo</h1>
      <p className="sub">
        Banho 01 · planta_74 · STONE_MONOLITH ·{' '}
        <span className="live"><i></i>ao vivo, atualiza sozinho</span>
      </p>
    </header>
  );
}

function NowCard({ agora, hint }){
  return (
    <section className="card now">
      <p className="label">Agora</p>
      <p className="big">{agora || 'carregando…'}</p>
      <p className="hint">{hint || ''}</p>
    </section>
  );
}

function CuradoriaCard({ open }){
  const [escolhas, setEscolhas] = useState(() => {
    const s = {};
    PECAS.forEach(p => { s[p.id] = 'manter'; });
    return s;
  });
  const [obs, setObs] = useState('');
  const [msg, setMsg] = useState('');
  const [sending, setSending] = useState(false);

  if (!open) return null;

  function escolher(id, val){
    setEscolhas(prev => ({ ...prev, [id]: val }));
  }

  function enviar(){
    setSending(true);
    setMsg('Enviando…');
    fetch('/api/curadoria', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kit: 'banho01', quando: new Date().toISOString(), escolhas, obs: obs.trim() })
    }).then(r => {
      if (!r.ok) throw new Error(r.status);
      setMsg('✔ Recebido! O Claude já está com as tuas escolhas.');
    }).catch(() => {
      setSending(false);
      setMsg('Falhou — o servidor local está de pé? Tenta de novo ou responde no chat.');
    });
  }

  return (
    <section className="card">
      <p className="label">Curadoria — kit de produtos reais</p>
      <div className="kit-grid">
        {PECAS.map(p => (
          <div className="kcard" key={p.id}>
            <div className="ph"><img alt={p.nm} src={p.img} /></div>
            <p className="nm">{p.nm}</p>
            <p className="ds">{p.ds}</p>
            <div className="opts">
              <button className={'opt' + (escolhas[p.id] === 'manter' ? ' sel' : '')}
                      onClick={() => escolher(p.id, 'manter')}>Manter</button>
              <button className={'opt' + (escolhas[p.id] === 'trocar' ? ' sel' : '')}
                      onClick={() => escolher(p.id, 'trocar')}>Trocar</button>
            </div>
          </div>
        ))}
      </div>
      <textarea placeholder="O que você não gostou, o que quer diferente, qualquer observação — escreve do teu jeito"
                value={obs} onChange={e => setObs(e.target.value)} />
      <div className="sendrow">
        <button id="send" disabled={sending} onClick={enviar}>Enviar escolhas</button>
        <span className="msg">{msg}</span>
      </div>
    </section>
  );
}

function StepsCard({ etapas }){
  return (
    <section className="card">
      <p className="label">Etapas do pedido</p>
      <ol className="steps">
        {(etapas || []).map((e, i) => (
          <li className={e.state} key={i}>
            <span className="dot"></span>{e.txt}
            {e.when ? <span className="t">{e.when}</span> : null}
          </li>
        ))}
      </ol>
    </section>
  );
}

function ScoreCard({ placar, badge }){
  const pl = placar || [];
  return (
    <section className="card">
      <p className="label">Placar do loop &nbsp;<span className="badge">{badge || ''}</span></p>
      <div className="score-row">
        {pl.map((p, i) => {
          const h = Math.max(8, Math.round((p.nota - 5.5) / 4.5 * 100));
          return (
            <div className={'bar' + (i === pl.length - 1 ? ' last' : '')} key={i}>
              <b>{p.nota.toFixed(1)}</b>
              <i style={{ height: h + '%' }}></i>
              <span>{p.rot}</span>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function RenderCard({ render, renderRot }){
  return (
    <section className="card">
      <p className="label">{renderRot || 'Último render'}</p>
      {render ? <img className="render" src={render} alt="Render mais recente do banho 01" /> : null}
    </section>
  );
}

function GaleriaCard({ galeria }){
  const gal = galeria || [];
  if (!gal.length) return null;
  return (
    <section className="card">
      <p className="label">Os três cômodos molhados — um tema pra cada</p>
      <div className="kit-grid">
        {gal.map((g, i) => (
          <div className="kcard" key={i}>
            <div className="ph tall"><img alt={g.rot} src={g.src} /></div>
            <p className="nm">{g.rot}</p>
            <p className="ds">{g.tema || ''}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function Top3Card({ top3 }){
  return (
    <section className="card">
      <p className="label">O que o juiz ainda sugeriu</p>
      <ol className="top3">
        {(top3 || []).map((t, i) => <li key={i}>{t}</li>)}
      </ol>
    </section>
  );
}

function Footer({ atualizado }){
  return <footer>Atualizado {atualizado || ''} — a página se atualiza sozinha a cada 5s.</footer>;
}

// engrenagem SVG (currentColor — segue o tema claro/escuro)
function Gear({ spinning }){
  return (
    <span className={'dw-gear ' + (spinning ? 'spinning' : 'idle')}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <path strokeLinecap="round" strokeLinejoin="round" d={
          'M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z' +
          'M19.4 13.5c.06-.5.1-1 .1-1.5s-.04-1-.1-1.5l1.9-1.5a.6.6 0 0 0 .14-.77l-1.8-3.1a.6.6 0 0 0-.73-.26l-2.24.9a7.6 7.6 0 0 0-1.3-.75l-.34-2.38a.6.6 0 0 0-.6-.5h-3.6a.6.6 0 0 0-.6.5l-.33 2.38c-.47.2-.9.45-1.3.75l-2.25-.9a.6.6 0 0 0-.73.26l-1.8 3.1a.6.6 0 0 0 .14.77l1.9 1.5c-.06.5-.1 1-.1 1.5s.04 1 .1 1.5l-1.9 1.5a.6.6 0 0 0-.14.77l1.8 3.1c.15.26.46.36.73.26l2.24-.9c.4.3.84.55 1.3.75l.34 2.38c.05.3.3.5.6.5h3.6c.3 0 .55-.2.6-.5l.33-2.38c.47-.2.9-.45 1.3-.75l2.25.9c.27.1.58 0 .73-.26l1.8-3.1a.6.6 0 0 0-.14-.77l-1.9-1.5Z'
        } />
      </svg>
    </span>
  );
}

function DesignerWidget({ rooms }){
  const [open, setOpen] = useState(false);
  if (!rooms || !rooms.length) return null;

  const current = rooms.find(r => r.state === 'thinking');
  const thinking = !!current;
  const done = rooms.filter(r => r.state === 'done').length;

  const tag = thinking ? 'agora' : 'concluído';
  const currentTxt = thinking
    ? current.room
    : (done === rooms.length ? done + '/' + rooms.length + ' cômodos decididos' : 'parado');

  return (
    <div id="designer-widget">
      {open && (
        <div className="dw-panel">
          <h4>Interior Designer — histórico por cômodo</h4>
          {rooms.map(r => {
            const dotClass = 'dw-dot ' + (r.state === 'thinking' ? 'pulsing' : (r.state === 'done' ? 'idle' : ''));
            const body = r.state === 'thinking' ? 'pensando…'
              : r.state === 'done' ? (r.resumo || 'decidido')
              : 'na fila';
            return (
              <div className="dw-row" key={r.room}>
                <span className={dotClass}></span>
                <div className="dw-body">
                  <p className="dw-room">{r.room}</p>
                  <p className="dw-resumo">{body}</p>
                  {r.mood ? <span className="dw-mood">{r.mood}</span> : null}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <div className="dw-app" onClick={() => setOpen(o => !o)}>
        <Gear spinning={thinking} />
        <div className="dw-now">
          <p className="dw-tag">{tag}</p>
          <p className="dw-current">{currentTxt}</p>
        </div>
      </div>
    </div>
  );
}

function App(){
  const st = useStatus(5000);
  if (!st) {
    return <main><Header /><section className="card now"><p className="big">carregando…</p></section></main>;
  }
  return (
    <React.Fragment>
      <main>
        <Header />
        <NowCard agora={st.agora} hint={st.hint} />
        <CuradoriaCard open={!!st.curadoria_aberta} />
        <StepsCard etapas={st.etapas} />
        <ScoreCard placar={st.placar} badge={st.badge} />
        <RenderCard render={st.render} renderRot={st.render_rot} />
        <GaleriaCard galeria={st.galeria} />
        <Top3Card top3={st.top3} />
        <Footer atualizado={st.atualizado} />
      </main>
      <DesignerWidget rooms={st.designer} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Babel standalone com data-presets="react" usa o JSX runtime AUTOMATIC por
  // default (injeta `import` de react/jsx-runtime) — quebra em <script> classico
  // (nao-module). Transform manual forcando runtime CLASSIC (React.createElement)
  // evita o import e mantem tudo num unico HTML sem build.
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  var s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
</script>
</body>
</html>
