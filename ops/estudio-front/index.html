<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio — ao vivo</title>
<style>
  :root{
    --bg:#F3F1EC; --panel:#FFFFFF; --panel2:#FAF8F4; --ink:#1E1B16; --muted:#847A6B;
    --line:#E7E1D4; --accent:#B5822F; --accent2:#8C6A2E; --accent-soft:#F3E6CC;
    --ok:#4E8A5C; --danger:#B85C4D; --shadow:0 2px 10px rgba(30,27,22,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111009; --panel:#1B1811; --panel2:#201C14; --ink:#F1ECDF; --muted:#9E9683;
      --line:#2E2A1E; --accent:#E0AC55; --accent2:#F0C077; --accent-soft:#382C17;
      --ok:#7CBB8B; --danger:#E28674; --shadow:0 2px 16px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;
    margin:0; padding:0 0 80px;}
  main{max-width:720px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; gap:18px;}

  header{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    padding:18px 16px 14px; border-bottom:1px solid var(--line); margin-bottom:2px;}
  header .inner{max-width:720px; margin:0 auto;}
  h1{font-weight:800; font-size:1.32rem; margin:0; letter-spacing:-.02em;}
  .sub{color:var(--muted); margin:3px 0 0; font-size:.84rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .live{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ok); font-weight:700;}
  .live i{width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block;}
  @media (prefers-reduced-motion: no-preference){
    .live i{animation:blink 1.6s ease-in-out infinite;}
    @keyframes blink{50%{opacity:.3}}
  }

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        padding:20px 22px; box-shadow:var(--shadow);}
  .label{font-size:.7rem; text-transform:uppercase; letter-spacing:.1em;
         color:var(--muted); margin:0 0 12px; font-weight:800;}

  .now{background:linear-gradient(160deg, var(--panel), var(--panel2));
       border:1px solid var(--line); position:relative; overflow:hidden;}
  .now::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg, var(--accent), var(--accent2));}
  .now .big{font-size:1.18rem; font-weight:700; margin:0; padding-left:2px;}
  .now .hint{color:var(--muted); margin:8px 0 0; font-size:.88rem; padding-left:2px; line-height:1.5;}

  .kit-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;}
  .kcard{border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--panel2);}
  .kcard .ph{background:#fff; border-radius:8px; height:110px; display:flex;
             align-items:center; justify-content:center; margin-bottom:10px; overflow:hidden;}
  .kcard .ph.tall{height:220px; background:transparent; border-radius:10px;}
  .kcard img{max-height:100px; max-width:100%;}
  .kcard .ph.tall img{max-height:100%; max-width:100%; object-fit:cover; border-radius:10px;}
  .kcard .nm{font-size:.84rem; font-weight:700; margin:0;}
  .kcard .ds{font-size:.74rem; color:var(--muted); margin:2px 0 8px;}
  .opts{display:flex; gap:6px;}
  .opt{flex:1; font:700 .76rem inherit; font-family:inherit; padding:7px 0; cursor:pointer;
       border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--muted);
       transition:.15s;}
  .opt.sel{background:var(--accent-soft); border-color:var(--accent); color:var(--accent2);}
  textarea{width:100%; min-height:70px; margin-top:14px; padding:12px 14px;
           border:1px solid var(--line); border-radius:10px; background:var(--panel2); color:var(--ink);
           font:inherit; font-size:.9rem; resize:vertical;}
  .sendrow{display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap;}
  button.primary{font:700 .9rem inherit; font-family:inherit; padding:11px 24px; cursor:pointer;
        border:none; border-radius:10px; background:var(--accent); color:#1a1408;}
  button.primary:disabled{opacity:.45; cursor:default;}
  button.primary:active{transform:scale(.97);}
  .msg{font-size:.82rem; color:var(--muted);}

  img.render{width:100%; border-radius:12px; display:block; background:var(--panel2);}
  .render-sub{color:var(--muted); font-size:.8rem; margin:10px 0 0;}

  footer{color:var(--muted); font-size:.76rem; text-align:center; padding-top:4px;}

  /* ---- chat com o designer / RAG ---- */
  .chat-log{display:flex; flex-direction:column; gap:10px; max-height:360px; overflow-y:auto;
    padding:2px 2px 6px; margin-bottom:12px;}
  .chat-empty{color:var(--muted); font-size:.86rem; padding:8px 2px;}
  .bubble{max-width:82%; padding:10px 14px; border-radius:14px; font-size:.87rem; line-height:1.48;
    white-space:pre-wrap; word-break:break-word;}
  .bubble.user{align-self:flex-end; background:var(--accent); color:#1a1408; border-bottom-right-radius:4px;}
  .bubble.assistant{align-self:flex-start; background:var(--panel2); border:1px solid var(--line);
    border-bottom-left-radius:4px;}
  .bubble.system{align-self:center; background:transparent; color:var(--muted); font-size:.76rem;
    font-style:italic; border:none; padding:2px 8px;}
  .bubble-row{display:flex; flex-direction:column;}
  .bubble-row.user{align-items:flex-end;}
  .save-btn{align-self:flex-start; margin-top:4px; font:700 .68rem inherit; font-family:inherit;
    padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color:var(--muted); cursor:pointer;}
  .save-btn:hover{border-color:var(--accent); color:var(--accent2);}
  .save-btn.saved{border-color:var(--ok); color:var(--ok);}
  .chat-inputrow{display:flex; gap:8px; align-items:flex-end;}
  .chat-input{flex:1; min-height:44px; max-height:120px; padding:11px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--panel2); color:var(--ink); font:inherit;
    font-size:.9rem; resize:none;}
  .chat-send{flex:none; width:44px; height:44px; border-radius:12px; border:none; cursor:pointer;
    background:var(--accent); color:#1a1408; font-size:1.1rem; display:flex; align-items:center;
    justify-content:center;}
  .chat-send:disabled{opacity:.4; cursor:default;}
  .infra-flags{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .flag{font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted);}
  .flag.up{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, var(--line));}
  .flag.down{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, var(--line));}

  /* ---- widget: monitor de atividade ao vivo, canto flutuante ---- */
  #designer-widget{position:fixed; right:18px; bottom:18px; z-index:50;
    font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;}
  .dw-app{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); box-shadow:0 8px 26px rgba(20,17,10,.25);
    border-radius:16px; padding:10px 18px 10px 10px; cursor:pointer; user-select:none;
    max-width:300px;}
  .dw-app:hover{border-color:var(--accent);}
  .dw-gear{flex:none; width:46px; height:46px; color:var(--accent);}
  .dw-gear svg{width:100%; height:100%; display:block;}
  .dw-gear.spinning svg{animation:dwspin 3.2s linear infinite;}
  .dw-gear.idle svg{color:var(--ok);}
  @media (prefers-reduced-motion: no-preference){
    @keyframes dwspin{to{transform:rotate(360deg);}}
  }
  .dw-now{min-width:0;}
  .dw-now .dw-tag{font-size:.65rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:700; margin:0 0 2px;}
  .dw-now .dw-current{font-size:.85rem; font-weight:700; margin:0; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical;}
  .dw-panel{position:absolute; right:0; bottom:calc(100% + 10px); width:320px; max-height:60vh;
    overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 10px 32px rgba(20,17,10,.3); padding:14px 16px;}
  .dw-panel h4{margin:0 0 10px; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); font-weight:800;}
  .dw-row{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line);}
  .dw-row:first-of-type{border-top:none;}
  .dw-dot{width:9px; height:9px; border-radius:50%; flex:none; margin-top:5px; background:var(--accent);}
  @media (prefers-reduced-motion: no-preference){
    .dw-dot.pulsing{animation:dwpulse 1.3s ease-in-out infinite;}
    @keyframes dwpulse{50%{opacity:.35}}
  }
  .dw-dot.idle{background:var(--ok);}
  .dw-row .dw-body{min-width:0;}
  .dw-room{font-size:.82rem; font-weight:700; margin:0;}
  .dw-resumo{font-size:.76rem; color:var(--muted); margin:2px 0 0; line-height:1.35;}
  .dw-mood{display:inline-block; margin-top:4px; font-size:.68rem; color:var(--accent2);
    background:var(--accent-soft); border-radius:999px; padding:1px 8px;}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

// app inteiro em React (sem build — Babel standalone transpila JSX no browser;
// server.py continua stdlib puro, só serve este HTML). Poll de /api/status a
// cada 5s é a única fonte de verdade pro que o Claude está produzindo. O chat
// (/api/chat) tem seu próprio poll mais rápido pra sentir vivo.

const PECAS = [
  {id:'vaso',     nm:'Vaso',             ds:'Roca The Gap, caixa acoplada',            img:'/assets/vaso_roca_gap.jpg'},
  {id:'cuba',     nm:'Cuba under-mount', ds:'Deca Slim 50cm (kit em ébano fosco)',     img:'/assets/cuba_deca_slim_L33050.jpg'},
  {id:'torneira', nm:'Torneira',         ds:'Deca Level black matte, bica média',      img:'/assets/torneira_deca_level_2880BL.jpg'},
  {id:'box',      nm:'Box de correr',    ds:'Ideia Glass Nobre, perfil preto',         img:'/assets/box_ideiaglass_nobre.jpg'},
  {id:'gabinete', nm:'Gabinete suspenso',ds:'Roca Tura, 2 gavetas (nosso vira greige)',img:'/assets/gabinete_roca_tura.jpg'},
  {id:'chuveiro', nm:'Chuveiro de teto', ds:'Deca Flex Max 22cm + comando You',        img:'/assets/chuveiro_deca_flexmax_22.jpg'}
];

function usePoll(url, intervalMs){
  const [data, setData] = useState(null);
  useEffect(() => {
    let alive = true;
    function load(){
      fetch(url).then(r => r.json())
        .then(d => { if (alive) setData(d); })
        .catch(() => {});
    }
    load();
    const t = setInterval(load, intervalMs);
    return () => { alive = false; clearInterval(t); };
  }, [url, intervalMs]);
  return data;
}

function Header(){
  return (
    <header>
      <div className="inner">
        <h1>Estúdio — planta_74</h1>
        <p className="sub">
          <span className="live"><i></i>ao vivo</span>
          <span>· acompanhamento em tempo real do que o Claude está gerando</span>
        </p>
      </div>
    </header>
  );
}

function NowCard({ agora, hint }){
  return (
    <section className="card now">
      <p className="label">Agora</p>
      <p className="big">{agora || 'carregando…'}</p>
      {hint ? <p className="hint">{hint}</p> : null}
    </section>
  );
}

function CuradoriaCard({ open }){
  const [escolhas, setEscolhas] = useState(() => {
    const s = {};
    PECAS.forEach(p => { s[p.id] = 'manter'; });
    return s;
  });
  const [obs, setObs] = useState('');
  const [msg, setMsg] = useState('');
  const [sending, setSending] = useState(false);

  if (!open) return null;

  function escolher(id, val){
    setEscolhas(prev => ({ ...prev, [id]: val }));
  }

  function enviar(){
    setSending(true);
    setMsg('Enviando…');
    fetch('/api/curadoria', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kit: 'banho01', quando: new Date().toISOString(), escolhas, obs: obs.trim() })
    }).then(r => {
      if (!r.ok) throw new Error(r.status);
      setMsg('✔ Recebido! O Claude já está com as tuas escolhas.');
    }).catch(() => {
      setSending(false);
      setMsg('Falhou — o servidor local está de pé? Tenta de novo ou responde no chat.');
    });
  }

  return (
    <section className="card">
      <p className="label">Curadoria — kit de produtos reais</p>
      <div className="kit-grid">
        {PECAS.map(p => (
          <div className="kcard" key={p.id}>
            <div className="ph"><img alt={p.nm} src={p.img} /></div>
            <p className="nm">{p.nm}</p>
            <p className="ds">{p.ds}</p>
            <div className="opts">
              <button className={'opt' + (escolhas[p.id] === 'manter' ? ' sel' : '')}
                      onClick={() => escolher(p.id, 'manter')}>Manter</button>
              <button className={'opt' + (escolhas[p.id] === 'trocar' ? ' sel' : '')}
                      onClick={() => escolher(p.id, 'trocar')}>Trocar</button>
            </div>
          </div>
        ))}
      </div>
      <textarea placeholder="O que você não gostou, o que quer diferente, qualquer observação — escreve do teu jeito"
                value={obs} onChange={e => setObs(e.target.value)} />
      <div className="sendrow">
        <button className="primary" disabled={sending} onClick={enviar}>Enviar escolhas</button>
        <span className="msg">{msg}</span>
      </div>
    </section>
  );
}

function RenderCard({ render, renderRot, badge }){
  if (!render) return null;
  return (
    <section className="card">
      <p className="label">
        Progresso do render {badge ? <span style={{color:'var(--accent2)', textTransform:'none', letterSpacing:'normal', fontWeight:700}}>· {badge}</span> : null}
      </p>
      <img className="render" src={render} alt="Render mais recente" />
      <p className="render-sub">{renderRot || ''}</p>
    </section>
  );
}

function GaleriaCard({ galeria }){
  const gal = galeria || [];
  if (!gal.length) return null;
  return (
    <section className="card">
      <p className="label">Os três cômodos molhados — um tema pra cada</p>
      <div className="kit-grid">
        {gal.map((g, i) => (
          <div className="kcard" key={i}>
            <div className="ph tall"><img alt={g.rot} src={g.src} /></div>
            <p className="nm">{g.rot}</p>
            <p className="ds">{g.tema || ''}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function Top3Card({ top3 }){
  const items = top3 || [];
  if (!items.length) return null;
  return (
    <section className="card">
      <p className="label">O que o juiz ainda sugeriu</p>
      <div style={{display:'flex', flexDirection:'column', gap:8}}>
        {items.map((t, i) => (
          <div key={i} style={{display:'flex', gap:10, fontSize:'.87rem', lineHeight:1.5}}>
            <span style={{color:'var(--accent2)', fontWeight:800}}>{i+1}</span>
            <span>{t}</span>
          </div>
        ))}
      </div>
    </section>
  );
}

// ---- chat com o designer + memória vetorial (RAG) ----
function ChatCard(){
  const [chatData, setChatData] = useState(null);
  const [text, setText] = useState('');
  const [sending, setSending] = useState(false);
  const [savedIdx, setSavedIdx] = useState({});
  const logRef = useRef(null);

  function load(){
    fetch('/api/chat').then(r => r.json()).then(setChatData).catch(() => {});
  }
  useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [chatData]);

  function send(){
    const msg = text.trim();
    if (!msg || sending) return;
    setSending(true);
    setText('');
    // otimista: mostra a msg do usuario na hora, sem esperar o servidor
    setChatData(prev => ({
      ...(prev || {}),
      history: [...((prev && prev.history) || []), { role: 'user', text: msg, ts: Date.now()/1000 }]
    }));
    fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    }).then(r => r.json()).then(() => { setSending(false); load(); })
      .catch(() => { setSending(false); load(); });
  }

  function salvar(idx, textoParaSalvar){
    fetch('/api/chat/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: textoParaSalvar })
    }).then(r => {
      if (r.ok) setSavedIdx(prev => ({ ...prev, [idx]: true }));
    });
  }

  const hist = (chatData && chatData.history) || [];
  const ollamaUp = chatData ? chatData.ollama_up : null;
  const qdrantUp = chatData ? chatData.qdrant_up : null;

  return (
    <section className="card">
      <p className="label">Conversa com o designer — vira memória (RAG)</p>
      <div className="chat-log" ref={logRef}>
        {!hist.length && (
          <p className="chat-empty">
            Escreve aqui o que você gosta ou não gosta (materiais, cores, estilo —
            "não gosto de piso branco", "quero mais madeira"). O designer responde na
            hora; quando quiser guardar de vez, clica em "salvar" na resposta dele.
          </p>
        )}
        {hist.map((h, i) => {
          if (h.role === 'assistant') {
            return (
              <div className="bubble-row" key={i}>
                <div className="bubble assistant">{h.text}</div>
                <button className={'save-btn' + (savedIdx[i] ? ' saved' : '')}
                        onClick={() => salvar(i, h.text)}>
                  {savedIdx[i] ? '✔ salvo na memória' : '💾 salvar na memória'}
                </button>
              </div>
            );
          }
          return (
            <div className="bubble-row user" key={i}>
              <div className="bubble user">{h.text}</div>
            </div>
          );
        })}
      </div>
      <div className="chat-inputrow">
        <textarea className="chat-input" rows={1} placeholder="Escreve aqui pro designer…"
          value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} />
        <button className="chat-send" disabled={sending || !text.trim()} onClick={send}>
          {sending ? '…' : '➤'}
        </button>
      </div>
      {chatData && (
        <div className="infra-flags">
          <span className={'flag ' + (ollamaUp ? 'up' : 'down')}>{ollamaUp ? '● Ollama' : '○ Ollama offline'}</span>
          <span className={'flag ' + (qdrantUp ? 'up' : 'down')}>{qdrantUp ? '● Qdrant' : '○ Qdrant offline'}</span>
        </div>
      )}
    </section>
  );
}

function Footer({ atualizado }){
  return <footer>Atualizado {atualizado || ''} — a página se atualiza sozinha.</footer>;
}

// engrenagem SVG (currentColor — segue o tema claro/escuro)
function Gear({ spinning }){
  return (
    <span className={'dw-gear ' + (spinning ? 'spinning' : 'idle')}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
        <path strokeLinecap="round" strokeLinejoin="round" d={
          'M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z' +
          'M19.4 13.5c.06-.5.1-1 .1-1.5s-.04-1-.1-1.5l1.9-1.5a.6.6 0 0 0 .14-.77l-1.8-3.1a.6.6 0 0 0-.73-.26l-2.24.9a7.6 7.6 0 0 0-1.3-.75l-.34-2.38a.6.6 0 0 0-.6-.5h-3.6a.6.6 0 0 0-.6.5l-.33 2.38c-.47.2-.9.45-1.3.75l-2.25-.9a.6.6 0 0 0-.73.26l-1.8 3.1a.6.6 0 0 0 .14.77l1.9 1.5c-.06.5-.1 1-.1 1.5s.04 1 .1 1.5l-1.9 1.5a.6.6 0 0 0-.14.77l1.8 3.1c.15.26.46.36.73.26l2.24-.9c.4.3.84.55 1.3.75l.34 2.38c.05.3.3.5.6.5h3.6c.3 0 .55-.2.6-.5l.33-2.38c.47-.2.9-.45 1.3-.75l2.25.9c.27.1.58 0 .73-.26l1.8-3.1a.6.6 0 0 0-.14-.77l-1.9-1.5Z'
        } />
      </svg>
    </span>
  );
}

function DesignerWidget({ rooms }){
  const [open, setOpen] = useState(false);
  if (!rooms || !rooms.length) return null;

  const current = rooms.find(r => r.state === 'thinking');
  const thinking = !!current;
  const done = rooms.filter(r => r.state === 'done').length;

  const tag = thinking ? 'agora' : 'concluído';
  const currentTxt = thinking
    ? current.room
    : (done === rooms.length ? done + '/' + rooms.length + ' cômodos decididos' : 'parado');

  return (
    <div id="designer-widget">
      {open && (
        <div className="dw-panel">
          <h4>Interior Designer — histórico por cômodo</h4>
          {rooms.map(r => {
            const dotClass = 'dw-dot ' + (r.state === 'thinking' ? 'pulsing' : (r.state === 'done' ? 'idle' : ''));
            const body = r.state === 'thinking' ? 'pensando…'
              : r.state === 'done' ? (r.resumo || 'decidido')
              : 'na fila';
            return (
              <div className="dw-row" key={r.room}>
                <span className={dotClass}></span>
                <div className="dw-body">
                  <p className="dw-room">{r.room}</p>
                  <p className="dw-resumo">{body}</p>
                  {r.mood ? <span className="dw-mood">{r.mood}</span> : null}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <div className="dw-app" onClick={() => setOpen(o => !o)}>
        <Gear spinning={thinking} />
        <div className="dw-now">
          <p className="dw-tag">{tag}</p>
          <p className="dw-current">{currentTxt}</p>
        </div>
      </div>
    </div>
  );
}

function App(){
  const st = usePoll('/api/status', 5000);
  if (!st) {
    return <main><Header /><section className="card now"><p className="big">carregando…</p></section></main>;
  }
  return (
    <React.Fragment>
      <Header />
      <main>
        <NowCard agora={st.agora} hint={st.hint} />
        <ChatCard />
        <CuradoriaCard open={!!st.curadoria_aberta} />
        <RenderCard render={st.render} renderRot={st.render_rot} badge={st.badge} />
        <GaleriaCard galeria={st.galeria} />
        <Top3Card top3={st.top3} />
        <Footer atualizado={st.atualizado} />
      </main>
      <DesignerWidget rooms={st.designer} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  // Babel standalone com data-presets="react" usa o JSX runtime AUTOMATIC por
  // default (injeta `import` de react/jsx-runtime) — quebra em <script> classico
  // (nao-module). Transform manual forcando runtime CLASSIC (React.createElement)
  // evita o import e mantem tudo num unico HTML sem build.
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  var s = document.createElement('script');
  s.textContent = out;
  document.body.appendChild(s);
</script>
</body>
</html>
