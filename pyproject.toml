[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchup-mcp"
version = "0.2.0"
description = "Minimal PDF floor-plan -> SketchUp .skp pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Felipe (GFCDOTA)" }]
keywords = ["sketchup", "floor-plan", "pdf"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "shapely>=2.0,<3.0",
  "pypdfium2>=4.30,<5.0",
  "Pillow>=10.0,<12.0",
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
  "jsonschema>=4.18,<5.0",
]
# Servidor MCP (tools/mcp_server). Instale com: pip install -e .[mcp]
# Teto <2.0: mcp 2.0.0 (lançado ~2026-08) quebra compat — moveu FastMCP pra
# fora de mcp.server.fastmcp (empacotado agora com mcp-types separado).
# ModuleNotFoundError confirmado em CI (job mcp-server) até essa versão ser
# resolvida/adaptada de propósito.
mcp = [
  "mcp>=1.2,<2.0",
]
# RAG do arquiteto (FP-037) — recall semântico OPCIONAL via Qdrant. NÃO entra no
# [dev]/CI: o adapter usa urllib puro (stdlib) e degrada pro faceted se a infra
# estiver off. Este grupo é conveniência p/ quem quiser o cliente tipado; o
# pipeline NÃO importa qdrant-client (o adapter fala HTTP direto). Ollama é infra
# externa (não é pacote pip). Instale com: pip install -e .[rag]
rag = [
  "qdrant-client>=1.12,<2.0",
]

[project.urls]
Repository = "https://github.com/GFCDOTA/sketchup-mcp"

[tool.setuptools.packages.find]
include = ["tools*", "core*", "interior*"]
exclude = ["tests*", "runs*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "planta74_scale: precisa da escala cota-anchored real de planta_74 (PT_TO_M=0.0259) — PT_TO_M e' lido UMA vez por processo em core.scale, entao estes testes rodam numa invocacao de pytest SEPARADA dos que usam fixtures sinteticas (default ~0.0352). Ver core/scale.py e tests/conftest.py.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv", "runs", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F811"]
